<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Little Words</title>

  <!-- Google Fonts for Friendly Rounded Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
  /* ==========================================================================
     Design Tokens & Themes
     ========================================================================== */
  :root {
    --bg-gradient: linear-gradient(135deg, #FFF9E6 0%, #FFF0F5 50%, #E8F4FD 100%);
    --bg-card: #FFFFFF;
    --bg-header: rgba(255, 255, 255, 0.88);
    --text-main: #1E293B;
    --text-sub: #475569;
    --text-muted: #64748B;
    --border-card: rgba(255, 255, 255, 0.9);
    --border-subtle: #E2E8F0;

    --primary-coral: #FF6B6B;
    --primary-yellow: #FFD93D;
    --primary-green: #6BCB77;
    --primary-blue: #4D96FF;
    --primary-purple: #9B5DE5;
    --primary-pink: #F15BB5;
    --primary-orange: #FF9234;

    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.07), 0 4px 10px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 20px 35px rgba(0, 0, 0, 0.1), 0 8px 16px rgba(0, 0, 0, 0.04);
    --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font-family: 'Nunito', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #0F2A3F 100%);
      --bg-card: #1E293B;
      --bg-header: rgba(30, 41, 59, 0.88);
      --text-main: #F8FAFC;
      --text-sub: #CBD5E1;
      --text-muted: #94A3B8;
      --border-card: rgba(255, 255, 255, 0.1);
      --border-subtle: #334155;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 20px 35px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #0F2A3F 100%);
    --bg-card: #1E293B;
    --bg-header: rgba(30, 41, 59, 0.88);
    --text-main: #F8FAFC;
    --text-sub: #CBD5E1;
    --text-muted: #94A3B8;
    --border-card: rgba(255, 255, 255, 0.1);
    --border-subtle: #334155;
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 35px rgba(0, 0, 0, 0.45);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    overflow: hidden;
    font-family: var(--font-family);
    background: var(--bg-gradient);
    color: var(--text-main);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .app-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 14px;
    position: relative;
    z-index: 10;
  }

  .confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 14px;
    background: var(--bg-header);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 2px solid var(--border-card);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-icon {
    font-size: 1.6rem;
    animation: float-subtle 3s ease-in-out infinite;
  }

  .brand-title {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .mode-switcher {
    display: flex;
    background: var(--border-subtle);
    padding: 4px;
    border-radius: 999px;
    gap: 4px;
  }

  .mode-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: none;
    background: transparent;
    border-radius: 999px;
    font-family: var(--font-family);
    font-weight: 800;
    font-size: 0.9rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s var(--spring-bounce);
  }

  .mode-btn.active {
    background: var(--bg-card);
    color: var(--primary-purple);
    box-shadow: 0 4px 12px rgba(155, 93, 229, 0.25);
    transform: scale(1.04);
  }

  .guardian-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tool-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border: 2px solid var(--border-subtle);
    background: var(--bg-card);
    border-radius: 14px;
    font-family: var(--font-family);
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s var(--spring-bounce);
  }

  .tool-btn:hover {
    transform: translateY(-2px);
  }

  .tool-btn:active {
    transform: scale(0.94);
  }

  .tool-btn.active {
    background: #EBF4FF;
    border-color: var(--primary-blue);
    color: var(--primary-blue);
  }

  .tool-btn.muted {
    opacity: 0.6;
  }

  .category-nav {
    display: flex;
    gap: 8px;
    padding: 10px 2px 4px 2px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    flex-shrink: 0;
  }

  .category-nav::-webkit-scrollbar {
    display: none;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--bg-card);
    border: 2px solid transparent;
    border-radius: 18px;
    font-family: var(--font-family);
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--text-sub);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
    transition: all 0.25s var(--spring-bounce);
  }

  .cat-btn:hover {
    transform: translateY(-2px) scale(1.02);
  }

  .cat-btn.active {
    color: #FFFFFF !important;
    box-shadow: var(--shadow-md);
    transform: translateY(-3px) scale(1.04);
  }

  .cat-icon {
    font-size: 1.25rem;
  }

  .interactive-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  .view-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .view-container[hidden] {
    display: none !important;
  }

  .flashcard-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 16px;
  }

  .nav-arrow-btn {
    width: 64px;
    height: 64px;
    min-width: 64px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 3px solid var(--border-subtle);
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.25s var(--spring-bounce);
    z-index: 20;
  }

  .nav-arrow-btn:hover {
    transform: scale(1.12);
    border-color: var(--primary-blue);
    box-shadow: var(--shadow-lg);
  }

  .nav-arrow-btn:active {
    transform: scale(0.9);
  }

  .flashcard {
    flex: 1;
    max-width: 500px;
    height: 100%;
    max-height: 480px;
    background: var(--bg-card);
    border-radius: 32px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
    border: 6px solid transparent;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s var(--spring-bounce), box-shadow 0.2s ease;
  }

  .flashcard:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 45px rgba(0, 0, 0, 0.12);
  }

  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-graphic {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
  }

  .card-svg-container {
    width: 100%;
    height: 100%;
    max-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-svg-container svg {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.08));
    transition: transform 0.3s var(--spring-bounce);
  }

  .flashcard:hover .card-svg-container svg {
    transform: scale(1.06);
  }

  .card-text-container {
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .card-title {
    font-size: 3.4rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
  }

  .card-subtitle {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-sub);
  }

  .card-phonics {
    display: inline-block;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--border-subtle);
    padding: 3px 12px;
    border-radius: 10px;
  }

  .card-action-prompt {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text-muted);
    background: var(--border-subtle);
    padding: 6px 16px;
    border-radius: 999px;
    margin-top: 4px;
  }

  .quiz-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    max-width: 760px;
    gap: 14px;
  }

  .quiz-prompt-card {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 14px 24px;
    box-shadow: var(--shadow-md);
    border: 4px solid var(--primary-purple);
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.2s var(--spring-bounce);
    max-width: 580px;
    width: 100%;
  }

  .quiz-prompt-card:hover {
    transform: scale(1.02);
  }

  .quiz-speaker-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-purple), #7B2CBF);
    border: none;
    color: #FFFFFF;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(155, 93, 229, 0.4);
    cursor: pointer;
    flex-shrink: 0;
    animation: float-subtle 2s ease-in-out infinite;
  }

  .quiz-prompt-content {
    display: flex;
    flex-direction: column;
  }

  .quiz-prompt-sub {
    font-size: 0.85rem;
    font-weight: 800;
    color: #9333EA;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .quiz-prompt-title {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.2;
  }

  .quiz-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    max-height: 380px;
    align-items: stretch;
  }

  .quiz-choice-card {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: var(--shadow-md);
    border: 5px solid var(--border-subtle);
    cursor: pointer;
    transition: transform 0.25s var(--spring-bounce), border-color 0.2s ease;
    position: relative;
  }

  .quiz-choice-card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary-blue);
  }

  .quiz-choice-card:active {
    transform: scale(0.95);
  }

  .quiz-choice-svg {
    width: 100%;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .quiz-choice-svg svg {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
  }

  .quiz-choice-label {
    font-size: 1.35rem;
    font-weight: 900;
    text-align: center;
  }

  .quiz-choice-card.correct {
    border-color: var(--primary-green) !important;
    background: #F0FDF4;
    animation: celebration-pop 0.6s var(--spring-bounce);
  }

  .quiz-choice-card.incorrect {
    border-color: #F87171 !important;
    background: #FEF2F2;
    animation: wiggle-shake 0.6s ease-in-out;
  }

  .app-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: var(--bg-header);
    backdrop-filter: blur(8px);
    border-radius: 18px;
    border: 2px solid var(--border-card);
    flex-shrink: 0;
    gap: 10px;
  }

  .footer-tip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-sub);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stars-counter {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FEF3C7;
    border: 2px solid #FDE68A;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 900;
    color: #B45309;
    font-size: 1rem;
    box-shadow: var(--shadow-sm);
    transition: transform 0.3s var(--spring-bounce);
  }

  .stars-counter.pulse {
    animation: star-pulse 0.6s var(--spring-bounce);
  }

  .welcome-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  .welcome-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .welcome-card {
    background: var(--bg-card);
    padding: 32px 28px;
    border-radius: 32px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    border: 5px solid #FFD93D;
    animation: bounce-in 0.6s var(--spring-bounce);
  }

  .welcome-emoji {
    font-size: 3.5rem;
    margin-bottom: 8px;
    animation: float-subtle 2.5s ease-in-out infinite;
  }

  .welcome-card h2 {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .welcome-card p {
    font-size: 1rem;
    color: var(--text-sub);
    line-height: 1.4;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .start-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #FF6B6B, #FF9234);
    color: #FFFFFF;
    border: none;
    border-radius: 20px;
    font-family: var(--font-family);
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4);
    transition: all 0.25s var(--spring-bounce);
  }

  .start-btn:hover {
    transform: translateY(-2px) scale(1.02);
  }

  @keyframes float-subtle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  @keyframes card-squish {
    0% { transform: scale(1); }
    30% { transform: scale(0.92) translateY(6px); }
    60% { transform: scale(1.08) translateY(-8px); }
    80% { transform: scale(0.98) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes bounce-in {
    0% { opacity: 0; transform: scale(0.6) translateY(30px); }
    60% { opacity: 1; transform: scale(1.05) translateY(-6px); }
    85% { transform: scale(0.98) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes wiggle-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px) rotate(-5deg); }
    40% { transform: translateX(8px) rotate(4deg); }
    60% { transform: translateX(-6px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(2deg); }
  }

  @keyframes star-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.35) rotate(15deg); background: #FDE047; }
    100% { transform: scale(1) rotate(0deg); }
  }

  @keyframes celebration-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.12) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .animate-squish { animation: card-squish 0.5s var(--spring-bounce); }
  .animate-bounce-in { animation: bounce-in 0.45s var(--spring-bounce); }

  @media (max-width: 768px) {
    .brand-title, .mode-text, .tool-label { display: none; }
    .nav-arrow-btn { width: 50px; height: 50px; min-width: 50px; font-size: 1.4rem; }
    .card-title { font-size: 2.6rem; }
    .card-subtitle { font-size: 1.25rem; }
    .quiz-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .quiz-choice-svg { height: 90px; }
    .quiz-choice-label { font-size: 1.1rem; }
  }

  @media (max-width: 480px) {
    .quiz-grid { grid-template-columns: 1fr; max-height: none; }
    .quiz-choice-card { flex-direction: row; padding: 10px 16px; justify-content: flex-start; gap: 14px; }
    .quiz-choice-svg { width: 60px; height: 60px; }
  }
  </style>
</head>
<body>

<!-- Fullscreen Celebration Particles Canvas -->
<canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

<div class="app-wrapper" id="app">
  <!-- Header & Guardian Controls -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🎈</span>
      <h1 class="brand-title">Little Words</h1>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-switcher" role="tablist" aria-label="Learning Mode">
      <button type="button" class="mode-btn active" id="btn-mode-learn" role="tab" aria-selected="true">
        <span class="mode-icon">👀</span>
        <span class="mode-text">Explore</span>
      </button>
      <button type="button" class="mode-btn" id="btn-mode-quiz" role="tab" aria-selected="false">
        <span class="mode-icon">🎯</span>
        <span class="mode-text">Find It!</span>
      </button>
    </div>

    <!-- Guardian Quick Settings / Audio Toolbar -->
    <div class="guardian-toolbar">
      <button type="button" class="tool-btn active" id="btn-toggle-sfx" title="Sound Effects On/Off" aria-label="Sound Effects On/Off" aria-pressed="true">
        <span class="tool-icon" id="sfx-icon">🔔</span>
        <span class="tool-label">SFX</span>
      </button>
      <button type="button" class="tool-btn active" id="btn-toggle-speech" title="Voice Speech On/Off" aria-label="Voice Speech On/Off" aria-pressed="true">
        <span class="tool-icon" id="speech-icon">🗣️</span>
        <span class="tool-label">Voice</span>
      </button>
      <button type="button" class="tool-btn" id="btn-toggle-fullscreen" title="Fullscreen Mode" aria-label="Fullscreen Mode">
        <span class="tool-icon">⛶</span>
      </button>
    </div>
  </header>

  <!-- Category Navigation Bar -->
  <nav class="category-nav" id="category-nav" aria-label="Learning Categories"></nav>

  <!-- Main Learning & Interactive Stage -->
  <main class="interactive-stage" id="stage">
    <div id="flashcard-view" class="view-container"></div>
    <div id="quiz-view" class="view-container" hidden></div>
  </main>

  <!-- Footer with Tips for Guardians & Keyboard Notice -->
  <footer class="app-footer">
    <div class="footer-tip">
      <span class="tip-icon">💡</span>
      <span class="tip-text" id="footer-tip-text">Tap cards to hear! Press <strong>A-Z</strong> or <strong>Spacebar</strong> for fun surprises.</span>
    </div>
    <div class="stars-counter" id="stars-counter" title="Stars Earned">
      <span class="star-icon">⭐</span>
      <span class="star-count" id="star-count-num">0</span>
    </div>
  </footer>
</div>

<!-- Audio Unlock / Welcome Modal -->

// 2. Vector SVGs Library
function createSVG(width, height, viewBox, content) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="${viewBox || `0 0 ${width} ${height}`}">${content}</svg>`;
}

const kawaiiFace = (x, y, scale = 1) => `
  <circle cx="${x - 14 * scale}" cy="${y}" r="${4.5 * scale}" fill="#1e293b"/>
  <circle cx="${x + 14 * scale}" cy="${y}" r="${4.5 * scale}" fill="#1e293b"/>
  <circle cx="${x - 16 * scale}" cy="${y - 2}" r="${1.5 * scale}" fill="#ffffff"/>
  <circle cx="${x + 12 * scale}" cy="${y - 2}" r="${1.5 * scale}" fill="#ffffff"/>
  <path d="M ${x - 10 * scale} ${y + 12 * scale} Q ${x} ${y + 20 * scale} ${x + 10 * scale} ${y + 12 * scale}"
        stroke="#EF4444" stroke-width="${3 * scale}" fill="none" stroke-linecap="round"/>
  <ellipse cx="${x - 22 * scale}" cy="${y + 8 * scale}" rx="${5 * scale}" ry="${3 * scale}" fill="#FCA5A5" opacity="0.6"/>
  <ellipse cx="${x + 22 * scale}" cy="${y + 8 * scale}" rx="${5 * scale}" ry="${3 * scale}" fill="#FCA5A5" opacity="0.6"/>
`;

// 3. Audio Synthesizer
class SoundSynthesizer {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setEnabled(state) { this.enabled = state; }

  playPop() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(550, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  playBubble() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.14);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  playTwinkle() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const now = this.ctx.currentTime + (i * 0.06);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    });
  }

  playBoing() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.linearRampToValueAtTime(320, now + 0.12);
    osc.frequency.linearRampToValueAtTime(180, now + 0.28);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.32);
  }

  playCheer() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const chord = [523.25, 659.25, 783.99, 1046.50];
    chord.forEach((freq) => {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.65);
    });
  }
}
const synthesizer = new SoundSynthesizer();

// 4. Speech Manager
class SpeechManager {
  constructor() {
    this.enabled = true;
    this.synth = window.speechSynthesis || null;
  }

  setEnabled(state) {
    this.enabled = state;
    if (!state && this.synth) this.synth.cancel();
  }

  speak(text) {
    if (!this.enabled || !this.synth || !text) return;
    this.synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.88;
    utterance.pitch = 1.15;
    utterance.lang = 'en-US';
    this.synth.speak(utterance);
  }
}
const speechManager = new SpeechManager();

// 5. Confetti Engine
class ConfettiEngine {
  constructor(canvasId = 'confetti-canvas') {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    this.particles = [];
    this.colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#9B5DE5', '#F15BB5'];
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.loop();
  }

  resize() {
    if (!this.canvas) return;
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }

  burst(x, y, count = 60) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 9;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 8 + Math.random() * 8,
        color: this.colors[Math.floor(Math.random() * this.colors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 12,
        alpha: 1,
        life: 0.96 + Math.random() * 0.03
      });
    }
  }

  loop() {
    if (this.ctx && this.canvas) {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.rotation += p.rotSpeed;
        p.alpha *= p.life;

        this.ctx.save();
        this.ctx.globalAlpha = p.alpha;
        this.ctx.translate(p.x, p.y);
        this.ctx.rotate((p.rotation * Math.PI) / 180);
        this.ctx.fillStyle = p.color;
        this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        this.ctx.restore();

        if (p.alpha < 0.05 || p.y > this.canvas.height + 50) {
          this.particles.splice(i, 1);
        }
      }
    }
    requestAnimationFrame(() => this.loop());
  }
}
const confettiEngine = new ConfettiEngine();

class FlashcardComponent {
  constructor(containerId, options = {}) {
    this.container = document.getElementById(containerId);
    this.onNext = options.onNext || (() => {});
    this.onPrev = options.onPrev || (() => {});
    this.currentItem = null;
  }

  render(item) {
    if (!this.container || !item) return;
    this.currentItem = item;

    this.container.innerHTML = `
      <div class="flashcard-stage">
        <button type="button" class="nav-arrow-btn" id="btn-card-prev" title="Previous Item">‹</button>
        <div class="flashcard animate-bounce-in" id="active-flashcard" style="border-color: ${item.themeColor}33;">
          <div class="card-badge" style="background: ${item.themeColor}22; color: ${item.themeColor};">
            <span>✨ Tap Card!</span>
          </div>
          <div class="card-graphic">
            <div class="card-svg-container">
              ${getSVG(item.svgKey, item.themeColor)}
            </div>
          </div>
          <div class="card-text-container">
            <h2 class="card-title" style="color: ${item.themeColor};">${item.label}</h2>
            <div class="card-subtitle">${item.subLabel}</div>
          </div>
          <div class="card-action-prompt">
            <span>🔊 Tap to Speak</span>
          </div>
        </div>
        <button type="button" class="nav-arrow-btn" id="btn-card-next" title="Next Item">›</button>
      </div>
    `;

    this.attachEvents();
  }

  attachEvents() {
    document.getElementById('btn-card-prev')?.addEventListener('click', (e) => {
      e.stopPropagation();
      synthesizer.playBubble();
      this.onPrev();
    });

    document.getElementById('btn-card-next')?.addEventListener('click', (e) => {
      e.stopPropagation();
      synthesizer.playBubble();
      this.onNext();
    });

    const card = document.getElementById('active-flashcard');
    card?.addEventListener('pointerdown', (e) => this.handleCardInteraction(e));
  }

  handleCardInteraction(e) {
    if (!this.currentItem) return;
    const card = document.getElementById('active-flashcard');
    if (card) {
      card.classList.remove('animate-squish');
      void card.offsetWidth;
      card.classList.add('animate-squish');
    }

    synthesizer.playPop();
    speechManager.speak(this.currentItem.speechText || this.currentItem.label);

    const x = e?.clientX || window.innerWidth / 2;
    const y = e?.clientY || window.innerHeight / 2;
    confettiEngine.burst(x, y, 25);
  }
}

// 7. Quiz Component ("Find It!")
class QuizComponent {
  constructor(containerId, options = {}) {
    this.container = document.getElementById(containerId);
    this.onScore = options.onScore || (() => {});
    this.targetItem = null;
    this.choices = [];
    this.isLocked = false;
  }

  startNewRound(allItems, categoryItems) {
    if (!this.container || !categoryItems || categoryItems.length === 0) return;
    this.isLocked = false;

    const targetIndex = Math.floor(Math.random() * categoryItems.length);
    this.targetItem = categoryItems[targetIndex];

    const distractors = [];
    const pool = categoryItems.length >= 3 ? categoryItems : allItems;

    while (distractors.length < 2) {
      const candidate = pool[Math.floor(Math.random() * pool.length)];
      if (candidate.id !== this.targetItem.id && !distractors.find(d => d.id === candidate.id)) {
        distractors.push(candidate);
      }
    }

    this.choices = [this.targetItem, ...distractors].sort(() => Math.random() - 0.5);
    this.render();
    this.speakPrompt();
  }

  render() {
    if (!this.container || !this.targetItem) return;

    this.container.innerHTML = `
      <div class="quiz-stage">
        <div class="quiz-prompt-card" id="quiz-prompt">
          <button type="button" class="quiz-speaker-btn" id="btn-repeat-prompt">🔊</button>
          <div class="quiz-prompt-content">
            <span class="quiz-prompt-sub">Can you find?</span>
            <h2 class="quiz-prompt-title" style="color: ${this.targetItem.themeColor};">
              ${this.targetItem.label} (${this.targetItem.subLabel})
            </h2>
          </div>
        </div>
        <div class="quiz-grid">
          ${this.choices.map((item, index) => `
            <div class="quiz-choice-card" data-id="${item.id}" id="choice-${index}" style="border-color: ${item.themeColor}22;">
              <div class="quiz-choice-svg">
                ${getSVG(item.svgKey, item.themeColor)}
              </div>
              <div class="quiz-choice-label" style="color: ${item.themeColor};">
                ${item.label}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    this.attachEvents();
  }

  speakPrompt() {
    if (!this.targetItem) return;
    speechManager.speak(`Can you find the ${this.targetItem.label}? ${this.targetItem.subLabel}`);
  }

  attachEvents() {
    document.getElementById('quiz-prompt')?.addEventListener('click', () => {
      synthesizer.playBubble();
      this.speakPrompt();
    });

    const cards = this.container.querySelectorAll('.quiz-choice-card');
    cards.forEach(card => {
      card.addEventListener('pointerdown', (e) => {
        const itemId = card.getAttribute('data-id');
        this.handleChoice(itemId, card, e);
      });
    });
  }

  handleChoice(selectedId, cardElement, event) {
    if (this.isLocked) return;

    if (selectedId === this.targetItem.id) {
      this.isLocked = true;
      cardElement.classList.add('correct');
      synthesizer.playCheer();
      synthesizer.playTwinkle();

      const rect = cardElement.getBoundingClientRect();
      const burstX = event?.clientX ?? (rect.left + rect.width / 2);
      const burstY = event?.clientY ?? (rect.top + rect.height / 2);
      confettiEngine.burst(burstX, burstY, 70);

      speechManager.speak(`Yay! You found the ${this.targetItem.label}! Great job!`);
      this.onScore();

      setTimeout(() => {
        if (this.onAdvance) this.onAdvance();
      }, 1800);
    } else {
      cardElement.classList.remove('incorrect');
      void cardElement.offsetWidth;
      cardElement.classList.add('incorrect');
      synthesizer.playBoing();

      const chosen = this.choices.find(c => c.id === selectedId);
      speechManager.speak(`That's ${chosen ? chosen.label : 'that'}! Can you find the ${this.targetItem.label}?`);
    }
  }

  setOnAdvance(cb) { this.onAdvance = cb; }
}

// 8. Toddler Keyboard Handler
class ToddlerKeyboardHandler {
  constructor(app) {
    this.app = app;
    window.addEventListener('keydown', (e) => this.handleKeyDown(e));
  }

  handleKeyDown(e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const key = e.key.toLowerCase();

    if (e.code === 'Space') {
      e.preventDefault();
      synthesizer.playTwinkle();
      confettiEngine.burst(window.innerWidth / 2, window.innerHeight / 2, 40);
      this.app.repeatActiveAudio();
      return;
    }

    if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
      e.preventDefault();
      this.app.nextItem();
      return;
    }

    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
      e.preventDefault();
      this.app.prevItem();
      return;
    }

    if (key.length === 1 && key >= 'a' && key <= 'z') {
      e.preventDefault();
      this.app.jumpToLetter(key);
      return;
    }

    if (key >= '1' && key <= '7') {
      e.preventDefault();
      this.app.selectCategoryByIndex(parseInt(key, 10) - 1);
      return;
    }

    synthesizer.playPop();
  }
}

// 9. Master App Controller
class ToddlerApp {
  constructor() {
    this.state = {
      activeCategory: 'letters',
      activeMode: 'learn',
      currentIndex: 0,
      starsCount: 0,
      soundEnabled: true,
      speechEnabled: true
    };

    this.flashcard = new FlashcardComponent('flashcard-view', {
      onNext: () => this.nextItem(),
      onPrev: () => this.prevItem()
    });

    this.quiz = new QuizComponent('quiz-view', {
      onScore: () => this.incrementStars()
    });
    this.quiz.setOnAdvance(() => this.nextQuizRound());

    this.keyboard = new ToddlerKeyboardHandler(this);
    this.init();
  }

  init() {
    this.renderCategoryNav();
    this.attachHeaderEvents();
    this.attachWelcomeOverlay();
    this.updateView();
  }

  getCurrentCategoryItems() {
    return LEARNING_ITEMS.filter(item => item.categoryId === this.state.activeCategory);
  }

  getCurrentItem() {
    const items = this.getCurrentCategoryItems();
    return items[this.state.currentIndex] || items[0];
  }

  renderCategoryNav() {
    const nav = document.getElementById('category-nav');
    if (!nav) return;

    nav.innerHTML = CATEGORIES.map(cat => {
      const isActive = cat.id === this.state.activeCategory;
      return `
        <button type="button"
                class="cat-btn ${isActive ? 'active' : ''}"
                data-id="${cat.id}"
                style="${isActive ? `background: ${cat.themeColor}; box-shadow: 0 8px 20px ${cat.themeColor}55;` : ''}">
          <span class="cat-icon">${cat.icon}</span>
          <span class="cat-label">${cat.label}</span>
        </button>
      `;
    }).join('');

    nav.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.selectCategory(btn.getAttribute('data-id'));
      });
    });
  }

  selectCategory(catId) {
    if (this.state.activeCategory === catId) return;
    synthesizer.playBubble();
    this.state.activeCategory = catId;
    this.state.currentIndex = 0;

    const catObj = CATEGORIES.find(c => c.id === catId);
    if (catObj && this.state.speechEnabled) {
      speechManager.speak(`Let's explore ${catObj.label}!`);
    }

    this.renderCategoryNav();
    this.updateView();
  }

  selectCategoryByIndex(index) {
    if (index >= 0 && index < CATEGORIES.length) {
      this.selectCategory(CATEGORIES[index].id);
    }
  }

  nextItem() {
    const items = this.getCurrentCategoryItems();
    this.state.currentIndex = (this.state.currentIndex + 1) % items.length;
    this.updateView();
  }

  prevItem() {
    const items = this.getCurrentCategoryItems();
    this.state.currentIndex = (this.state.currentIndex - 1 + items.length) % items.length;
    this.updateView();
  }

  jumpToLetter(char) {
    if (this.state.activeCategory !== 'letters') {
      this.state.activeCategory = 'letters';
      this.renderCategoryNav();
    }
    const items = this.getCurrentCategoryItems();
    const index = items.findIndex(item => item.id === `letter-${char}`);
    if (index !== -1) {
      this.state.currentIndex = index;
      this.setMode('learn');
      this.updateView();
      this.flashcard.handleCardInteraction();
    }
  }

  repeatActiveAudio() {
    if (this.state.activeMode === 'learn') {
      this.flashcard.handleCardInteraction();
    } else {
      this.quiz.speakPrompt();
    }
  }

  nextQuizRound() {
    this.quiz.startNewRound(LEARNING_ITEMS, this.getCurrentCategoryItems());
  }

  incrementStars() {
    this.state.starsCount += 1;
    const numEl = document.getElementById('star-count-num');
    const counterEl = document.getElementById('stars-counter');
    if (numEl) numEl.textContent = this.state.starsCount;
    if (counterEl) {
      counterEl.classList.remove('pulse');
      void counterEl.offsetWidth;
      counterEl.classList.add('pulse');
    }
  }

  setMode(mode) {
    if (this.state.activeMode === mode) return;
    synthesizer.playBubble();
    this.state.activeMode = mode;

    document.getElementById('btn-mode-learn')?.classList.toggle('active', mode === 'learn');
    document.getElementById('btn-mode-quiz')?.classList.toggle('active', mode === 'quiz');

    const flashcardView = document.getElementById('flashcard-view');
    const quizView = document.getElementById('quiz-view');

    if (mode === 'learn') {
      if (flashcardView) flashcardView.hidden = false;
      if (quizView) quizView.hidden = true;
      this.updateView();
    } else {
      if (flashcardView) flashcardView.hidden = true;
      if (quizView) quizView.hidden = false;
      this.nextQuizRound();
    }
  }

  updateView() {
    if (this.state.activeMode === 'learn') {
      this.flashcard.render(this.getCurrentItem());
    } else {
      this.nextQuizRound();
    }
  }

  attachHeaderEvents() {
    document.getElementById('btn-mode-learn')?.addEventListener('click', () => this.setMode('learn'));
    document.getElementById('btn-mode-quiz')?.addEventListener('click', () => this.setMode('quiz'));

    const btnSfx = document.getElementById('btn-toggle-sfx');
    const sfxIcon = document.getElementById('sfx-icon');
    btnSfx?.addEventListener('click', () => {
      this.state.soundEnabled = !this.state.soundEnabled;
      synthesizer.setEnabled(this.state.soundEnabled);
      btnSfx.classList.toggle('active', this.state.soundEnabled);
      btnSfx.classList.toggle('muted', !this.state.soundEnabled);
      if (sfxIcon) sfxIcon.textContent = this.state.soundEnabled ? '🔔' : '🔕';
      if (this.state.soundEnabled) synthesizer.playPop();
    });

    const btnSpeech = document.getElementById('btn-toggle-speech');
    const speechIcon = document.getElementById('speech-icon');
    btnSpeech?.addEventListener('click', () => {
      this.state.speechEnabled = !this.state.speechEnabled;
      speechManager.setEnabled(this.state.speechEnabled);
      btnSpeech.classList.toggle('active', this.state.speechEnabled);
      btnSpeech.classList.toggle('muted', !this.state.speechEnabled);
      if (speechIcon) speechIcon.textContent = this.state.speechEnabled ? '🗣️' : '🤫';
      if (this.state.speechEnabled) speechManager.speak("Voice is on!");
    });

    document.getElementById('btn-toggle-fullscreen')?.addEventListener('click', () => {
      synthesizer.playBubble();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  }

  attachWelcomeOverlay() {
    const overlay = document.getElementById('welcome-overlay');
    const btnStart = document.getElementById('btn-start');

    const unlockAndStart = () => {
      synthesizer.init();
      synthesizer.playTwinkle();
      confettiEngine.burst(window.innerWidth / 2, window.innerHeight / 2, 80);
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => overlay.remove(), 500);
      }
      if (this.state.speechEnabled) {
        speechManager.speak("Welcome! Let's learn words together!");
      }
    };

    btnStart?.addEventListener('click', unlockAndStart);
    overlay?.addEventListener('pointerdown', (e) => {
      if (e.target === overlay) unlockAndStart();
    });
  }
}

// Bootstrap application on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  window.toddlerApp = new ToddlerApp();
});
